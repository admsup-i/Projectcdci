name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # standard EC2 = amd64; add linux/arm64 too if you ever use Graviton instances
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo
            SHA=${{ github.sha }}

            # Save current SHA as "previous" before overwriting, for rollback
            if [ -f /home/${{ secrets.EC2_USERNAME }}/current_sha.txt ]; then
              sudo cp /home/${{ secrets.EC2_USERNAME }}/current_sha.txt /home/${{ secrets.EC2_USERNAME }}/previous_sha.txt
            fi
            echo $SHA | sudo tee /home/${{ secrets.EC2_USERNAME }}/current_sha.txt

            # Append to full history log too
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)  $SHA" | sudo tee -a /home/${{ secrets.EC2_USERNAME }}/deploy_history.log

            sudo docker pull $IMAGE:$SHA
            sudo docker stop ci-cd-demo || true
            sudo docker rm ci-cd-demo || true
            sudo docker run -d \
              --name ci-cd-demo \
              --restart unless-stopped \
              -p 8081:8081 \
              $IMAGE:$SHA

            # Keep :latest pointing at what's actually running (optional, for visibility)
            sudo docker tag $IMAGE:$SHA $IMAGE:latest
