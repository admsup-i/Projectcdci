mkdir -p .github/workflows
cat > .github/workflows/rollback.yml << 'EOF'
name: Rollback Deployment
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision number to roll back to (leave blank for previous revision)"
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Rollback via kubectl
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REV="${{ github.event.inputs.revision }}"

            if [ -z "$REV" ]; then
              kubectl rollout undo deployment/ci-cd-demo
            else
              kubectl rollout undo deployment/ci-cd-demo --to-revision=$REV
            fi

            kubectl rollout status deployment/ci-cd-demo --timeout=120s
